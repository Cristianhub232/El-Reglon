# El Renglón
#   Solo base de datos (desarrollo):      docker compose up -d db
#   Todo (base, API/UI y programador BCV): docker compose --profile app up -d --build
#   Metabase (opcional, análisis):         herramientas/instalar_metabase.sh && docker compose --profile metabase up -d
# Configuración: cp .env.example .env (y cambiar la contraseña)
services:
  db:
    image: postgres:16.14-alpine          # versión fija: builds reproducibles
    container_name: elrenglon-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elrenglon}
      POSTGRES_USER: ${POSTGRES_USER:-elrenglon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${POSTGRES_PUERTO:-55432}:5432"   # solo accesible desde esta máquina
    volumes:
      - elrenglon-pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
      - ./datos:/datos:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped               # sin esto, tras reiniciar el servidor la app vuelve pero la base no

  app:
    profiles: ["app"]
    build: { context: ., target: ejecucion }
    image: elrenglon-app:0.1.0
    container_name: elrenglon-app
    environment: &entorno_app
      POSTGRES_HOST: db
      POSTGRES_PUERTO: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-elrenglon}
      POSTGRES_USER: ${POSTGRES_USER:-elrenglon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      TZ: America/Caracas
      IVA_OFF: ${IVA_OFF:-1}
      APP_SECRETO: ${APP_SECRETO:-}              # obligatoria para la verificación en dos pasos (openssl rand -hex 32)
      TRUST_PROXY: ${TRUST_PROXY:-1}          # el puerto solo escucha en 127.0.0.1: únicamente el proxy local llega aquí
      COOKIE_SEGURA: ${COOKIE_SEGURA:-1}
      SOPORTE_WHATSAPP: ${SOPORTE_WHATSAPP:-}
      SOPORTE_CORREO: ${SOPORTE_CORREO:-}
      WORLDNEWS_API_KEY: ${WORLDNEWS_API_KEY:-}   # noticiero: fuentes que no se leen por RSS (TalCual); ver docs/20
      VAPID_PUBLICO: ${VAPID_PUBLICO:-}           # avisos push (docs/24): sin claves, los avisos no se ofrecen
      VAPID_PRIVADO: ${VAPID_PRIVADO:-}
      VAPID_CONTACTO: ${VAPID_CONTACTO:-mailto:soporte@elrenglonve.org}
      COMPARADOR_HOST: comparador                 # servicios de las tiendas del comparador (red interna); ver docs/22
    ports:
      - "127.0.0.1:${APP_PUERTO:-3000}:3000"   # publicar detrás de un proxy inverso con TLS
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  bcv-programador:
    profiles: ["app"]
    image: elrenglon-app:0.1.0
    container_name: elrenglon-bcv-programador
    command: ["node", "scripts/bcv-programador.ts"]
    environment:
      <<: *entorno_app
      BCV_HORAS: ${BCV_HORAS:-8,14,20}
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  # Comparador de precios: un servicio por tienda bajo PM2 (pm2-runtime), solo en la red interna (sin puertos
  # publicados). Ver docs/22 y comparador/ecosystem.config.cjs. Estado: docker exec elrenglon-comparador pm2 ls
  comparador:
    profiles: ["app"]
    build: { context: ., target: comparador }
    image: elrenglon-comparador:0.1.0
    container_name: elrenglon-comparador
    environment:
      <<: *entorno_app
      COMPARADOR_ESCUCHA: 0.0.0.0
      COMPARADOR_INDICE: ${COMPARADOR_INDICE:-1}   # 0: no recorrer los sitemaps (Farmatodo, Plan Suárez, Gama) en esta copia
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  # Noticiero: lee los titulares de los medios cada hora (RSS, WordPress y WorldNewsAPI). Ver docs/20.
  noticias-programador:
    profiles: ["app"]
    image: elrenglon-app:0.1.0
    container_name: elrenglon-noticias-programador
    command: ["node", "scripts/noticias-programador.ts"]
    environment:
      <<: *entorno_app
      NOTICIAS_MINUTO: ${NOTICIAS_MINUTO:-5}
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  # Metabase: análisis sobre los datos de El Renglón con el rol metabase_lectura (solo lectura, sin
  # core.usuario, core.sesion ni core.api_key). Su configuración vive en la base "metabase" del mismo
  # PostgreSQL. Roles y base: herramientas/instalar_metabase.sh. Ver docs/19.
  metabase:
    profiles: ["metabase"]
    image: metabase/metabase:v0.63.18.5   # versión fija
    container_name: elrenglon-metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-}
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:-}   # cifra en su base las credenciales de conexión
      MB_SITE_URL: ${METABASE_URL:-}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: America/Caracas
      TZ: America/Caracas
      JAVA_OPTS: ${METABASE_JAVA_OPTS:--Xmx1g}
    ports:
      - "127.0.0.1:${METABASE_PUERTO:-3001}:3000"   # publicar detrás del proxy inverso con TLS
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  elrenglon-pgdata:
